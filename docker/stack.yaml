services:
  frontend:
    image: YOUR_DOCKERHUB_USERNAME/heran-music-frontend:1.0.0
    ports:
      - "80:80"
    networks:
      - heran-network
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        order: start-first

  backend:
    image: YOUR_DOCKERHUB_USERNAME/heran-music-backend:1.0.0
    networks:
      - heran-network
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        order: start-first

  database:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: heran_music
      MARIADB_USER: heran_app
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb_data:/var/lib/mysql
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - heran-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

networks:
  heran-network:
    driver: overlay

volumes:
  mariadb_data:

secrets:
  db_password:
    external: true
  db_root_password:
    external: true
